name: Build and Push to GHCR
run-name: "CI - Build, Tag, Push"

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Cancel in progress for PR open and close, but not merge_group
  group: ${{ github.event.number }}
  cancel-in-progress: true

jobs:
  pr-description-add:
    name: PR Description Add
    if: github.event_name == 'pull_request'
    env:
      DOMAIN: apps.silver.devops.gov.bc.ca
      PREFIX: ${{ github.event.repository.name }}-${{ github.event.number }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 1
    steps:
      - uses: bcgov/action-pr-description-add@d79a5c3b49d3b3b3215495afac3ae599cef191bb #v2.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_markdown: |
            ---

            Thanks for the PR!

            After merge, new images are deployed and promoted to DEV:
            - [DEV Homepage](https://${{ env.PREFIX }}.${{ env.DOMAIN }})

  # Get PR number for merge queues, otherwise jusr use github.event.nuber
  vars:
    name: Set Variables
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      branch: ${{ github.head_ref}}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: PR Number
        id: pr
        if: github.event_name == 'pull_request'
        uses: bcgov/action-get-pr@bfa713a9ab410c0f0c13126c35983934fc80d15b #v0.1.1

  # https://github.com/bcgov/action-builder-ghcr
  builds:
    name: Builds
    needs: [vars]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [api, client, twm]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@2b24ac7f95e6a019064151498660437cca3202c5 #v4.2.1
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          package: '${{ matrix.package }}'
          build_context: ${{ matrix.package }}
          build_file: '${{ matrix.package }}/Dockerfile'
          tags: pr-${{ needs.vars.outputs.pr }}
          tag_fallback: latest
          triggers: '${{ matrix.package }}/' #omit to build everything
          metadata_tags: 'true'
          metadata_tag_rules: |
            type=raw,value=pr-${{ needs.vars.outputs.pr }}-${{ needs.vars.outputs.branch }},enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
