name: Update GitOps repository
run-name: "Helm Deploy (${{ inputs.environment || github.event.inputs.environment || 'dev' }})"

on:
  workflow_call:
    inputs:
      tag:
        description: "Specify a tag to deploy; defaults to PR number"
        required: false
        type: string
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: string
    secrets:
      GITOPS_REPO_PAT:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - uat
          - prod
      tag:
        description: Specify a tag to deploy
        required: false
        type: string

concurrency:
  # Serialize deploys per environment (do not cancel in-flight deploys)
  group: deploy-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-gitops:
    environment: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
       # Variables
      - if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov/action-get-pr@bfa713a9ab410c0f0c13126c35983934fc80d15b # v0.1.1
      - id: vars
        run: |
          # Tag defaults to explicitly provided input, then PR number, then the branch name
          PR=${{ steps.pr.outputs.pr }}
          if [ -n "$PR" ]; then
             PR_TAG="pr-$PR"
          else
             PR_TAG=""
          fi
          
          tag=${{ inputs.tag || github.event.inputs.tag }}
          tag=${tag:-$PR_TAG}
          tag=${tag:-${{ github.ref_name }}}

          # Output
          echo "tag=${tag}" >> $GITHUB_OUTPUT
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: 'bcgov-c/tenant-gitops-2d982c'
          token: ${{ secrets.GITOPS_REPO_PAT }}
          path: gitops-repo

      - name: Update Helm values
        run: |
          cd gitops-repo
          ENV="${{ inputs.environment || github.event.inputs.environment || 'dev' }}"
          TAG="${{ steps.vars.outputs.tag }}"
          
          # Use yq to update the tag in the values file
          yq -i ".global.image.tag = \"${TAG}\"" argocd/env-apps/values-${ENV}.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argocd/env-apps/values-${ENV}.yaml
          git commit -m "Deploy CRT to ${ENV} with tag ${TAG}" || echo "No changes to commit"
          git push origin main
          
  promote-images:
    name: Promote Images
    needs: [update-gitops]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [api, twm, client]
    timeout-minutes: 2
    steps:
      - uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.update-gitops.outputs.tag }}
          tags: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}  # Promote images AFTER successful deploy
