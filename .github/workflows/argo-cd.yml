name: CD - Update GitOps repository
run-name: "GitOps Update to ${{ inputs.environment || github.event.inputs.environment || 'dev' }}"

on:
  workflow_call:
    inputs:
      tag:
        description: "Specify a tag to deploy. Required."
        required: true
        type: string
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: string
    secrets:
      GITOPS_REPO_PAT:
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test
          - uat
          - prod
      tag:
        description: Specify a tag to deploy (commit sha, sha-xxxxxxx, branch name, or pr-123). Required.
        required: true
        type: string

concurrency:
  # Serialize deploys per environment (do not cancel in-flight deploys)
  group: deploy-${{ inputs.environment || github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-gitops:
    environment: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      environment: ${{ steps.vars.outputs.environment }}
    steps:
       # Variables
      - if: ${{ ! inputs.tag }}
        id: pr
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1
      - id: vars
        env:
          RAW_ENVIRONMENT: ${{ inputs.environment || github.event.inputs.environment || 'dev' }}
          RAW_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail

          ENVIRONMENT="$RAW_ENVIRONMENT"

          case "$ENVIRONMENT" in
            dev|test|uat|prod) ;;
            *)
              echo "Error: unsupported environment '$RAW_ENVIRONMENT'. Expected one of: dev, test, uat, prod."
              exit 1
              ;;
          esac

          # Tag defaults to explicitly provided input, then PR number, then the branch name
          PR=${{ steps.pr.outputs.pr }}
          if [ -n "$PR" ]; then
             PR_TAG="pr-$PR"
          else
             PR_TAG=""
          fi
          
          TAG="$RAW_TAG"
          TAG=${TAG:-$PR_TAG}
          TAG=${TAG:-${{ github.ref_name }}}

          if [[ "$TAG" =~ ^sha-([0-9a-fA-F]{7,40})$ ]]; then
            SHA="${BASH_REMATCH[1]}"
            TAG="sha-${SHA:0:7}"
          elif [[ "$TAG" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            TAG="sha-${TAG:0:7}"
          fi

          # Output
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Environment: ${ENVIRONMENT}"
          echo "Tag: ${TAG}"
      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: 'bcgov-c/tenant-gitops-2d982c'
          token: ${{ secrets.GITOPS_REPO_PAT }}
          path: gitops-repo

      - name: Update Helm values
        run: |
          set -euo pipefail

          cd gitops-repo
          ENV="${{ steps.vars.outputs.environment }}"
          TAG="${{ steps.vars.outputs.tag }}"
          VALUES_FILE="argocd/env-apps/values-${ENV}.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "Error: GitOps values file '$VALUES_FILE' does not exist."
            exit 1
          fi
          
          # Use yq to update the tag in the values file
          yq -i ".global.image.tag = \"${TAG}\"" "$VALUES_FILE"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "Deploy CRT to ${ENV} with tag ${TAG}" || echo "No changes to commit"
          git push origin main
          
  promote-images:
    name: Promote Images
    needs: [update-gitops]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [api, twm, client]
    timeout-minutes: 2
    steps:
      - uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.update-gitops.outputs.tag }}
          tags: ${{ needs.update-gitops.outputs.environment }}
